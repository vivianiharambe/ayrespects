<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amen Barvaz Selley</title>
    <style>
        /* Reset margins and make the page fill the entire screen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.1s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        h1 {
            color: black;
            font-size: 4rem;
            /* This gives it that "rail thin" look */
            font-weight: 100; 
            letter-spacing: 0.3em;
            text-transform: uppercase;
            user-select: none;
        }

        /* This utility class will be triggered by JavaScript */
        body.activated {
            background-color: red;
        }
        
        body.activated h1 {
            display: none;
        }
    </style>
</head>
<body>

    <h1 id="text">AMEN BARVAZ SELLEY</h1>

    <script>
        // Listen for keyboard presses on the window
        window.addEventListener('keydown', function(event) {
            // Check if the key pressed is 'f' or 'F'
            if (event.key === 'f' || event.key === 'F') {
                document.body.classList.add('activated');
            }
        });
    </script>
</body>
</html>
