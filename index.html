<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body { font-family: sans-serif; background: #fafafa; text-align: center; padding-top: 100px; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>Welcome to my website!</h1>
    <p>Press the F key to go to the subpage.</p>

    <script>
        document.addEventListener('keydown', function(event) {
            if (event.key === 'f' || event.key === 'F') {
                window.location.href = '/page'; 
            }
        });
    </script>
</body>
</html>
